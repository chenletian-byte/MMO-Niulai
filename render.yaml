services:
  - type: web
    name: mmo-maths
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIE
        value: "1"
      - key: DEEPSEEK_API_KEY
        sync: false
    disk:
      name: mmo-data
      mountPath: /var/data
      sizeGB: 1
