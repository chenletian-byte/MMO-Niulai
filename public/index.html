<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#7a5fd0">
<title>MMO · O-Level Maths Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/css/app.css">
<script>
  // apply theme/font before paint
  try {
    const s = JSON.parse(localStorage.getItem('mmo.prefs') || '{}');
    if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme;
    if (s.font) document.documentElement.dataset.font = s.font;
  } catch {}
</script>
<script defer src="/vendor/katex/katex.min.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div id="app"><div class="loader"></div></div>
<div class="toasts" id="toasts"></div>
</body>
</html>
